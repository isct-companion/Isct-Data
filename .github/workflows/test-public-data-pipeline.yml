# TEMPORARY: exercises the new pipeline from this branch before merge.
# publish_data.py refuses to publish outside main, so this cannot change data.
# Delete this file before merging.
name: Test public data pipeline (temporary)

on:
  push:
    branches: [fix/publisher-test-isolation]
    paths: [.github/workflows/test-public-data-pipeline.yml]

permissions: {}

concurrency:
  group: public-data-update
  cancel-in-progress: false

jobs:
  pipeline:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/public-data-pipeline.yml
    with:
      dataset: exams
      force: true
    secrets: inherit
