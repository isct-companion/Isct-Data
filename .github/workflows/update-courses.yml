name: Update course catalog

# The public syllabus, read by a script (no model): every unit listing daily and
# the detail pages whose syllabus update date moved; every detail page on
# Sundays. See docs/courses.md.
on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Read every detail page again
        type: boolean
        default: false

permissions: {}

# Its own queue: a full read takes over an hour and must not hold the other
# public-data updates back.
concurrency:
  group: course-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read the syllabus
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          # 18:23 UTC on Saturday is 03:23 JST on Sunday.
          if [ "$FULL" = true ] || { [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 6 ]; }; then
            python scripts/syllabus_courses.py --full
          else
            python scripts/syllabus_courses.py
          fi
      - run: python scripts/update_subscription_index.py
      - run: python scripts/validate_datasets.py
      - run: python scripts/update_subscription_index.py --check
      - name: Open a pull request for changed catalog files
        env:
          DATA_PR_TOKEN: ${{ secrets.DATA_PR_TOKEN }}
        run: python scripts/syllabus_courses.py --publish "$GITHUB_SHA"
