# The one Isct-Data service (docs/data-pipeline.md): schedules every job, publishes to main and
# serves the status page on the NAS's loopback only; a tunnel on the NAS publishes it.
name: isct-data

services:
  isct-data:
    build:
      context: ../..
      dockerfile: ops/data-pipeline/Dockerfile
    image: isct-data:local
    container_name: isct-data
    restart: unless-stopped
    init: true
    user: "${PUID:-1026}:${PGID:-100}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file: pipeline.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "${STATE_ROOT:-./var}/state:/data/state"
      - "${STATE_ROOT:-./var}/github-app:/run/isct-github:ro"
    mem_limit: 1536m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
